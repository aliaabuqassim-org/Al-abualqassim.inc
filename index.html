<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-abualqassim.inc POS</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182f;
      --card: #1a2445;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --muted: #9ca3af;
      --text: #f8fafc;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1d2959 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: rgba(17, 24, 47, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(4px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.18);
      color: #bae6fd;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .search {
      width: 100%;
      margin-bottom: 12px;
    }

    input, select, button {
      font: inherit;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text);
      background: #0f172a;
      border-radius: 10px;
      padding: 10px;
    }

    input::placeholder { color: #7f8aa1; }

    .search input { width: 100%; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      max-height: calc(100vh - 170px);
      overflow: auto;
      padding-right: 2px;
    }

    .product {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product h3 {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .product small { color: var(--muted); }

    .product .price {
      font-weight: 700;
      color: #86efac;
    }

    .product button,
    .actions button,
    .pay-btn {
      cursor: pointer;
      background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
      border: none;
      font-weight: 600;
    }

    .product button:hover,
    .actions button:hover,
    .pay-btn:hover { filter: brightness(1.07); }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 45vh;
      overflow: auto;
      margin: 8px 0 12px;
      padding-right: 2px;
    }

    .cart-row {
      background: #0b1531;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .qty-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }

    .qty-controls button {
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #16203f;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .totals {
      display: grid;
      gap: 6px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      padding-top: 10px;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .line {
      display: flex;
      justify-content: space-between;
      color: #dbe2f0;
    }

    .line.total {
      font-size: 1.08rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .actions .danger {
      background: linear-gradient(135deg, #dc2626, #f43f5e);
    }

    .pay {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .pay-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      font-size: 1rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 20px 10px;
      border: 1px dashed rgba(148, 163, 184, 0.2);
      border-radius: 12px;
    }

    .receipt {
      margin-top: 12px;
      background: #0a1328;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
      color: #d1d9e8;
      white-space: pre-wrap;
      display: none;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .products { max-height: none; }
      .cart-items { max-height: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="topbar">
        <h1>Al-abualqassim.inc POS</h1>
        <span class="badge">Live Cashier Mode</span>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search product name or category..." />
      </div>
      <div id="products" class="products"></div>
    </section>

    <aside class="panel">
      <div class="topbar">
        <h2 style="margin: 0; font-size: 1.1rem;">Current Sale</h2>
        <span id="itemCount" class="badge">0 items</span>
      </div>

      <label for="customerName">Customer</label>
      <input id="customerName" type="text" placeholder="Walk-in customer" />

      <div id="cartItems" class="cart-items"></div>

      <div class="totals">
        <div class="line"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="line"><span>Tax (5%)</span><strong id="tax">$0.00</strong></div>
        <div class="line total"><span>Total</span><strong id="total">$0.00</strong></div>
      </div>

      <div class="pay">
        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod">
          <option>Cash</option>
          <option>Card</option>
          <option>Mobile Transfer</option>
        </select>
        <button class="pay-btn" id="completeSale">Complete Sale</button>
      </div>

      <div class="actions">
        <button id="clearCart" class="danger">Clear Cart</button>
        <button id="printReceipt">Generate Receipt</button>
      </div>

      <pre id="receipt" class="receipt"></pre>
    </aside>
  </main>

  <script>
    const products = [
      { id: 1, name: 'Rice 5kg', category: 'Grocery', price: 18.5 },
      { id: 2, name: 'Cooking Oil 1L', category: 'Grocery', price: 3.8 },
      { id: 3, name: 'Sugar 2kg', category: 'Grocery', price: 4.9 },
      { id: 4, name: 'Chicken (Fresh)', category: 'Meat', price: 7.2 },
      { id: 5, name: 'Milk 1L', category: 'Dairy', price: 1.6 },
      { id: 6, name: 'Eggs 12pcs', category: 'Dairy', price: 2.4 },
      { id: 7, name: 'Tea Premium', category: 'Beverage', price: 5.2 },
      { id: 8, name: 'Coffee Classic', category: 'Beverage', price: 6.4 },
      { id: 9, name: 'Bread', category: 'Bakery', price: 1.1 },
      { id: 10, name: 'Bottled Water', category: 'Beverage', price: 0.8 }
    ];

    const TAX_RATE = 0.05;
    const cart = new Map();

    const productsEl = document.getElementById('products');
    const cartItemsEl = document.getElementById('cartItems');
    const subtotalEl = document.getElementById('subtotal');
    const taxEl = document.getElementById('tax');
    const totalEl = document.getElementById('total');
    const itemCountEl = document.getElementById('itemCount');
    const receiptEl = document.getElementById('receipt');

    function renderProducts(filter = '') {
      const query = filter.trim().toLowerCase();
      const filtered = products.filter((p) =>
        p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)
      );

      productsEl.innerHTML = filtered.map((p) => `
        <article class="product">
          <small>${p.category}</small>
          <h3>${p.name}</h3>
          <div class="price">$${p.price.toFixed(2)}</div>
          <button data-add="${p.id}">Add to Cart</button>
        </article>
      `).join('');
    }

    function addToCart(productId) {
      const current = cart.get(productId) || 0;
      cart.set(productId, current + 1);
      renderCart();
    }

    function updateQty(productId, delta) {
      const current = cart.get(productId) || 0;
      const next = current + delta;
      if (next <= 0) cart.delete(productId);
      else cart.set(productId, next);
      renderCart();
    }

    function calculate() {
      let subtotal = 0;
      let itemCount = 0;
      for (const [id, qty] of cart.entries()) {
        const p = products.find((product) => product.id === id);
        if (!p) continue;
        subtotal += p.price * qty;
        itemCount += qty;
      }
      const tax = subtotal * TAX_RATE;
      const total = subtotal + tax;
      return { subtotal, tax, total, itemCount };
    }

    function renderCart() {
      if (cart.size === 0) {
        cartItemsEl.innerHTML = '<div class="empty">No items in cart yet.</div>';
      } else {
        cartItemsEl.innerHTML = [...cart.entries()].map(([id, qty]) => {
          const p = products.find((product) => product.id === id);
          if (!p) return '';
          return `
            <div class="cart-row">
              <div>
                <strong>${p.name}</strong><br>
                <small>$${p.price.toFixed(2)} each</small>
                <div class="qty-controls">
                  <button data-qty="${id}" data-delta="-1">−</button>
                  <span>${qty}</span>
                  <button data-qty="${id}" data-delta="1">+</button>
                </div>
              </div>
              <strong>$${(p.price * qty).toFixed(2)}</strong>
            </div>
          `;
        }).join('');
      }

      const { subtotal, tax, total, itemCount } = calculate();
      subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
      taxEl.textContent = `$${tax.toFixed(2)}`;
      totalEl.textContent = `$${total.toFixed(2)}`;
      itemCountEl.textContent = `${itemCount} item${itemCount === 1 ? '' : 's'}`;
    }

    function generateReceipt() {
      const { subtotal, tax, total, itemCount } = calculate();
      if (itemCount === 0) {
        receiptEl.style.display = 'none';
        alert('Cart is empty. Add products first.');
        return;
      }

      const customer = document.getElementById('customerName').value.trim() || 'Walk-in customer';
      const payment = document.getElementById('paymentMethod').value;
      const lines = [...cart.entries()].map(([id, qty]) => {
        const p = products.find((product) => product.id === id);
        return `${p.name.padEnd(20, ' ')} x${qty}   $${(p.price * qty).toFixed(2)}`;
      }).join('\n');

      const receipt = `Al-abualqassim.inc POS\n--------------------------------\nCustomer: ${customer}\nPayment: ${payment}\nDate: ${new Date().toLocaleString()}\n--------------------------------\n${lines}\n--------------------------------\nItems: ${itemCount}\nSubtotal: $${subtotal.toFixed(2)}\nTax:      $${tax.toFixed(2)}\nTotal:    $${total.toFixed(2)}\n--------------------------------\nThank you for shopping!`;

      receiptEl.textContent = receipt;
      receiptEl.style.display = 'block';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderProducts(e.target.value);
    });

    productsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-add]');
      if (!btn) return;
      addToCart(Number(btn.dataset.add));
    });

    cartItemsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-qty]');
      if (!btn) return;
      updateQty(Number(btn.dataset.qty), Number(btn.dataset.delta));
    });

    document.getElementById('clearCart').addEventListener('click', () => {
      cart.clear();
      receiptEl.style.display = 'none';
      renderCart();
    });

    document.getElementById('printReceipt').addEventListener('click', generateReceipt);

    document.getElementById('completeSale').addEventListener('click', () => {
      if (cart.size === 0) {
        alert('No items to checkout.');
        return;
      }
      generateReceipt();
      alert('Sale completed successfully.');
      cart.clear();
      renderCart();
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
